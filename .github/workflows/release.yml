name: Build and Release EvertySSH

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  build-windows:
    name: Build Windows Exe
    needs: checks
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Enable Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build EvertySSH Release
        run: cargo build --release --locked --bin everty-ssh

      - name: Prepare Windows Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-files
          Copy-Item target/release/everty-ssh.exe release-files/
          Copy-Item Logo.png release-files/ -ErrorAction SilentlyContinue
          Copy-Item README.md release-files/ -ErrorAction SilentlyContinue
          Copy-Item LICENSE release-files/ -ErrorAction SilentlyContinue
          Copy-Item docs release-files/ -Recurse -Force
          Compress-Archive -Path release-files/* -DestinationPath EvertySSH-windows-x64.zip -Force

      - name: Upload Artifact (EvertySSH-windows-x64)
        uses: actions/upload-artifact@v4
        with:
          name: EvertySSH-windows-x64
          path: |
            release-files/everty-ssh.exe
            EvertySSH-windows-x64.zip
          retention-days: 14

  build-linux:
    name: Build Linux Executable
    needs: checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Enable Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libfontconfig1-dev libxkbcommon-dev libx11-dev libwayland-dev fonts-dejavu-core

      - name: Build EvertySSH Release
        run: cargo build --release --locked --bin everty-ssh

      - name: Prepare Linux Package
        run: |
          mkdir -p release-files
          cp target/release/everty-ssh release-files/
          cp Logo.png release-files/ || true
          cp README.md release-files/ || true
          cp LICENSE release-files/ || true
          cp -r docs release-files/
          tar -czvf EvertySSH-linux-x64.tar.gz -C release-files .

      - name: Upload Artifact (EvertySSH-linux-x64)
        uses: actions/upload-artifact@v4
        with:
          name: EvertySSH-linux-x64
          path: |
            release-files/everty-ssh
            EvertySSH-linux-x64.tar.gz
          retention-days: 14

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: EvertySSH-*
          path: release-assets
          merge-multiple: true

      - name: Select release notes
        id: notes
        shell: bash
        run: |
          notesPath="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$notesPath" ]; then
            echo "path=$notesPath" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: EvertySSH ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.path }}
          files: |
            release-assets/everty-ssh.exe
            release-assets/EvertySSH-windows-x64.zip
            release-assets/everty-ssh
            release-assets/EvertySSH-linux-x64.tar.gz
          draft: false
          prerelease: false
          generate_release_notes: true
