name: Build and Release EvertySSH

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Exe
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Enable Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build EvertySSH Release
        run: cargo build --release --bin everty-ssh

      - name: Prepare Windows Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/EvertySSH
          Copy-Item target/release/everty-ssh.exe dist/EvertySSH/
          Copy-Item Logo.png dist/EvertySSH/ -ErrorAction SilentlyContinue
          Copy-Item README.md dist/EvertySSH/ -ErrorAction SilentlyContinue
          Copy-Item LICENSE dist/EvertySSH/ -ErrorAction SilentlyContinue
          Compress-Archive -Path dist/EvertySSH/* -DestinationPath dist/EvertySSH-windows-x64.zip -Force

      - name: Upload Artifact (EvertySSH-windows-x64)
        uses: actions/upload-artifact@v4
        with:
          name: EvertySSH-windows-x64
          path: |
            dist/EvertySSH/everty-ssh.exe
            dist/EvertySSH-windows-x64.zip
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/EvertySSH/everty-ssh.exe
            dist/EvertySSH-windows-x64.zip
          draft: false
          prerelease: false
          generate_release_notes: true
