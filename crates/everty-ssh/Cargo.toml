[package]
name = "everty-ssh"
version = "0.2.3"
edition = "2021"
license = "MIT"
publish = false
description = "Fast, minimalist SSH client with session and command history"

[dependencies]
everty-ui = { path = "../everty-ui" }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
softbuffer = "0.4"
winit = "0.30"
vte = "0.14"
tokio = { version = "1", features = ["full"] }
russh = "0.44"
russh-keys = "0.44"
async-trait = "0.1"
uuid = { version = "1.8", features = ["v4", "serde"] }
parking_lot = "0.12"
crossbeam-channel = "0.5"
image = { version = "0.25", default-features = false, features = ["png"] }
arboard = "3"
rfd = "0.15"
sha2 = "0.10"
serde_json = "1.0"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"
